[project]
name = "minari-api"
version = "0.1.0"
description = "Minari — Autonomous Flaky Test Intelligence Agent (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "structlog==24.*",
    "slowapi==0.1.9",
    "asyncpg==0.30.*",
    "httpx==0.27.*",
    "langchain-mcp-adapters==0.1.*",
    "redis==5.*",
]

[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "ruff==0.7.*",
    "mypy==1.13.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
